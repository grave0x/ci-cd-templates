# =============================================================================
# Stale — close stale issues and PRs automatically
# =============================================================================
#
# Copy this file into your repo to keep your issue tracker tidy.
# =============================================================================

name: Stale

on:
  schedule:
    - cron: "30 1 * * 1"  # Every Monday at 1:30am

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Issues
          stale-issue-message: >
            This issue has been inactive for 60 days. If it's still relevant,
            please comment — otherwise it will be closed in 14 days.
          days-before-issue-stale: 60
          days-before-issue-close: 14

          # PRs
          stale-pr-message: >
            This PR has been inactive for 30 days. Please address the feedback
            or it will be closed in 7 days.
          days-before-pr-stale: 30
          days-before-pr-close: 7

          # Exempt labels
          exempt-issue-labels: "pinned,security,enhancement"
          exempt-pr-labels: "pinned,security,dependencies"
