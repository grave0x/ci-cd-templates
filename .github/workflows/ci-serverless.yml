# =============================================================================
# Serverless Framework CI — lint, test, and deploy serverless apps
# =============================================================================
#
# Copy into your repo. Validates and deploys Serverless Framework
# applications (AWS Lambda, Azure Functions, GCP Cloud Functions).
#
# Requires: serverless.yml at repo root
# Prerequisites:
#   - Cloud provider credentials (AWS_ACCESS_KEY_ID, etc.) as secrets
# =============================================================================

name: Serverless CI

on:
  push:
    branches: [main, master]
    paths: ["serverless.yml", "**/serverless.yml"]
  pull_request:
    branches: [main, master]
    paths: ["serverless.yml", "**/serverless.yml"]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Serverless Framework
        run: npm install -g serverless

      - name: Validate
        run: sls package --stage dev

  deploy:
    name: Deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Serverless Framework
        run: npm install -g serverless

      - name: Deploy
        run: sls deploy --stage ${{ vars.SLS_STAGE || 'prod' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
