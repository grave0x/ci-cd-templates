# =============================================================================
# Helm CI — lint, template, test, and publish Helm charts
# =============================================================================
#
# Copy into your repo as .github/workflows/helm.yml
# Requires: Chart.yaml at repo root or ./charts/
#
# What it does:
#   - helm lint
#   - helm template (render locally)
#   - helm test (if a cluster is available)
#   - helm package + push (on tag)
# =============================================================================

name: Helm CI

on:
  push:
    branches: [main, master]
    paths: ["**/Chart.yaml", "**/charts/**"]
  pull_request:
    branches: [main, master]
    paths: ["**/Chart.yaml", "**/charts/**"]
  push:
    tags: ["helm-v*"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Lint charts
        run: |
          for chart in $(find . -name Chart.yaml -exec dirname {} \;); do
            echo "Linting: $chart"
            helm lint "$chart"
          done

      - name: Template
        run: |
          for chart in $(find . -name Chart.yaml -exec dirname {} \;); do
            echo "Templating: $chart"
            helm template test-release "$chart"
          done

  publish:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/helm-v')
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Login to registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin

      - name: Package and push
        run: |
          for chart in $(find . -name Chart.yaml -exec dirname {} \;); do
            helm package "$chart" --destination /tmp/charts
          done
          for pkg in /tmp/charts/*.tgz; do
            helm push "$pkg" oci://ghcr.io/${{ github.repository_owner }}/charts
          done
