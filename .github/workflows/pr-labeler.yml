# =============================================================================
# PR Labeler — auto-label pull requests by changed paths
# =============================================================================
#
# Copy this file and .github/labeler.yml into your repo.
# =============================================================================

name: PR Labeler

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true
