# =============================================================================
# Rust Release — publish to crates.io on tag
# =============================================================================
#
# Copy this file and adapt. To trigger a release:
#   1. Bump version in Cargo.toml
#   2. Commit and tag:  git tag v0.1.0 && git push origin v0.1.0
#
# Requires:
#   - CARGO_REGISTRY_TOKEN secret set in repo settings
#   - GitHub Release (auto-created from tag)
# =============================================================================

name: Release (Rust)

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Verify version matches tag
        run: |
          PKG_VER=$(cargo metadata --format-version 1 --no-deps \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['packages'][0]['version'])")
          TAG_VER="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "ERROR: Cargo.toml version ($PKG_VER) != tag version ($TAG_VER)"
            exit 1
          fi

      - name: Publish dry-run
        run: cargo publish --dry-run

      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build release binary
        run: cargo build --release

      - name: Upload binary
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/release/${{ github.event.repository.name }}
          asset_name: ${{ github.event.repository.name }}-${{ github.ref_name }}-x86_64-linux
          tag: ${{ github.ref }}
          overwrite: true
