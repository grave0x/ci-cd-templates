# =============================================================================
# Weekly Dependency Report — comment outdated deps on issues
# =============================================================================
#
# Copy into your repo. Runs weekly and creates an issue summarizing
# outdated dependencies across all ecosystems in the repo.
# =============================================================================

name: Weekly Dependency Report

on:
  schedule:
    - cron: "0 9 * * 1"  # Every Monday at 9am
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check npm outdated
        if: hashFiles('package.json') != ''
        id: npm
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          echo "npm_outdated<<EOF" >> $GITHUB_OUTPUT
          npm outdated --long 2>/dev/null >> $GITHUB_OUTPUT || true
          echo "EOF" >> $GITHUB_OUTPUT
        if: hashFiles('package.json') != ''
        shell: bash

      - name: Check cargo outdated
        if: hashFiles('Cargo.toml') != ''
        id: cargo
        run: |
          echo "cargo_outdated<<EOF" >> $GITHUB_OUTPUT
          cargo install cargo-outdated 2>/dev/null && cargo outdated 2>/dev/null >> $GITHUB_OUTPUT || echo "No outdated tool" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        shell: bash
        continue-on-error: true

      - name: Check pip outdated
        if: hashFiles('requirements.txt', 'pyproject.toml') != ''
        id: pip
        run: |
          echo "pip_outdated<<EOF" >> $GITHUB_OUTPUT
          pip list --outdated 2>/dev/null >> $GITHUB_OUTPUT || echo "No pip" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        shell: bash
        continue-on-error: true

      - name: Create summary issue
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '## Weekly Dependency Report',
              '',
              '| Ecosystem | Status |',
              '|-----------|--------|',
              `| npm | ${{ steps.npm.outputs.npm_outdated && 'Has outdated deps (see below)' || 'Up to date' }} |`,
              `| Cargo | ${{ steps.cargo.outputs.cargo_outdated && 'Has outdated deps (see below)' || 'Up to date' }} |`,
              `| pip | ${{ steps.pip.outputs.pip_outdated && 'Has outdated deps (see below)' || 'Up to date' }} |`,
              '',
              '### npm outdated',
              '```',
              `${{ steps.npm.outputs.npm_outdated || 'None' }}`,
              '```',
              '',
              '### Cargo outdated',
              '```',
              `${{ steps.cargo.outputs.cargo_outdated || 'None' }}`,
              '```',
              '',
              '### pip outdated',
              '```',
              `${{ steps.pip.outputs.pip_outdated || 'None' }}`,
              '```',
              '',
              '_Auto-generated weekly report_'
            ].join('\n');

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Dependency Report ${new Date().toISOString().slice(0, 10)}`,
              body: body,
              labels: ['dependencies', 'automation']
            });
