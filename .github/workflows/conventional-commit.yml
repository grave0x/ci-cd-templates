# =============================================================================
# Conventional Commit — enforce commit conventions on PRs
# =============================================================================
#
# Copy into your repo to enforce Conventional Commits on PR titles.
# Valid prefixes: feat, fix, chore, docs, style, refactor, perf, test, ci
#
# https://www.conventionalcommits.org/
# =============================================================================

name: Conventional Commit

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read
  statuses: write

jobs:
  check:
    name: Check PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Configure which types are allowed
          types: |
            feat
            fix
            chore
            docs
            style
            refactor
            perf
            test
            ci
            build
            revert
          # Require that the scope is present
          requireScope: false
          # When using "feat" or "fix", you can use "!" to indicate breaking change
          # e.g. "feat!: add breaking feature"
          # If you want subjectLinter, add:
          # subjectPattern: ^(?![A-Z]).+$
          # subjectPatternError: |
          #   The subject "{subject}" has an uppercase first character.
          #   Use lowercase (e.g. "fix: add retry logic").
          wip: true
          # Validate the PR title matches expected pattern
          validateSingleCommit: false
