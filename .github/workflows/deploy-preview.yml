# =============================================================================
# Deploy Preview — per-PR preview deployments with auto-cleanup
# =============================================================================
#
# Copy into your repo. Creates a preview deployment for every PR and
# tears it down when the PR is closed/merged. Works with Vercel, Netlify,
# Cloudflare Pages, or any custom host via the deploy-preview composite action.
#
# Secrets needed (depending on platform):
#   - VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID
#   - NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID
#   - CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
# =============================================================================

name: Deploy Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  deploy:
    name: Deploy preview
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Vercel ─────────────────────────────────────────────────────
      - name: Deploy to Vercel
        if: env.VERCEL_TOKEN
        uses: amondnet/vercel-action@v25
        id: vercel
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prebuilt"
          scope: ${{ secrets.VERCEL_ORG_ID }}
        continue-on-error: true

      # ── Netlify ────────────────────────────────────────────────────
      - name: Deploy to Netlify
        if: env.NETLIFY_AUTH_TOKEN
        uses: nwtgck/actions-netlify@v3
        id: netlify
        with:
          publish-dir: ./build
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Preview ${{ github.event.pull_request.title }}"
          enable-commit-comment: false
          alias: pr-${{ github.event.number }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        continue-on-error: true

      # ── Cloudflare Pages ───────────────────────────────────────────
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN
        uses: cloudflare/wrangler-action@v3
        id: cloudflare
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./build --project-name=${{ github.event.repository.name }} --branch=pr-${{ github.event.number }}
        continue-on-error: true

      # ── Comment preview URL ────────────────────────────────────────
      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const urls = [
              '${{ steps.vercel.outputs.preview-url }}',
              '${{ steps.netlify.outputs.deploy-url }}',
              '${{ steps.cloudflare.outputs.deployment-url }}'
            ].filter(Boolean);
            if (urls.length === 0) {
              console.log('No preview URL to post');
              return;
            }
            const body = `## Preview\n\n${urls.map(u => `- [${new URL(u).hostname}](${u.startsWith('http') ? u : 'https://' + u})`).join('\n')}\n\n_Deployed from commit ${context.sha.slice(0, 7)}_`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  teardown:
    name: Teardown preview
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Comment cleanup notice
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Preview Teardown\n\nPreview environment for this PR has been torn down.`
            });
      # Add platform-specific teardown steps here:
      # Vercel: vercel rm --yes --token
      # Netlify: netlify deploy --alias=pr-${{ github.event.number }} --clear
      # Cloudflare: wrangler pages deployment delete
