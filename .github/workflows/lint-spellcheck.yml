# =============================================================================
# Spellcheck — check spelling in documentation and code comments
# =============================================================================
#
# Copy into your repo. Uses codespell to find common misspellings
# in source files, documentation, and configuration.
# =============================================================================

name: Spellcheck

on:
  push:
    branches: [main, master]
    paths: ["**/*.md", "**/*.txt", "**/*.rst"]
  pull_request:
    branches: [main, master]
    paths: ["**/*.md", "**/*.txt", "**/*.rst"]

jobs:
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install codespell
        run: pip install codespell

      - name: Check spelling
        run: |
          codespell \
            --skip="*.git,node_modules,vendor,target,dist,build,.venv,__pycache__" \
            --ignore-words-list="crate,ba,ake,fo,te,nd,tht,ue,hist,iff,orm,ost" \
            --check-filenames \
            --check-hidden
