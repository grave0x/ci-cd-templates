# =============================================================================
# Elixir / Phoenix CI — quality gate for Elixir projects
# =============================================================================
#
# Copy into your repo as .github/workflows/ci.yml
# Requires: mix.exs at repo root
#
# What it does:
#   - mix format --check-formatted
#   - mix credo (lint)
#   - mix dialyzer (type check, optional)
#   - mix test
#   - mix compile --warnings-as-errors
# =============================================================================

name: CI (Elixir)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  MIX_ENV: test

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        otp-version: ["26", "27"]
        elixir-version: ["1.17"]
      fail-fast: false

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-elixir@v1
        with:
          otp-version: ${{ matrix.otp-version }}
          elixir-version: ${{ matrix.elixir-version }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get --only test

      - name: Format check
        run: mix format --check-formatted

      - name: Lint (Credo)
        run: mix credo --strict
        continue-on-error: true

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Test
        run: mix test

      - name: Dialyzer
        run: mix dialyzer
        continue-on-error: true
