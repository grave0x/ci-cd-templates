# =============================================================================
# Bun CI — quality gate for Bun / JavaScript / TypeScript projects
# =============================================================================
#
# Copy into your repo as .github/workflows/ci-bun.yml
# Requires: package.json + bun.lock at repo root
#
# What it does:
#   - bun install (frozen lockfile)
#   - bun lint (if script exists)
#   - bun test
#   - bun run build (if script exists)
# =============================================================================

name: CI (Bun)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bun-version: [latest, "1.1"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun ${{ matrix.bun-version }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun lint 2>/dev/null || echo "No lint script"

      - name: Type check
        run: bun run tsc --noEmit 2>/dev/null || echo "No tsc configured"

      - name: Test
        run: bun test 2>/dev/null || echo "No tests found"

      - name: Build
        run: bun run build 2>/dev/null || echo "No build script"
