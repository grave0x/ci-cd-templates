# =============================================================================
# Welcome First-Time Contributor
# =============================================================================
#
# Copy into your repo. Automatically welcomes first-time contributors
# with a friendly comment and helpful links on their first PR or issue.
# =============================================================================

name: Welcome

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  pull-requests: write
  issues: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pr-message: |
            👋 Welcome! Thanks for opening your first pull request.

            A few things to keep in mind:
            - Make sure all CI checks pass before requesting review
            - Link any related issues in the description
            - Keep changes focused — one PR per feature/fix

            A maintainer will review your PR shortly. Thanks for contributing!
          issue-message: |
            👋 Thanks for opening your first issue!

            To help us triage it effectively:
            - Use a clear, descriptive title
            - Include steps to reproduce (for bugs)
            - Add relevant labels if you can

            A maintainer will follow up. Welcome to the community!
