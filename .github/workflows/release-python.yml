# =============================================================================
# Python Release — publish to PyPI on tag
# =============================================================================
#
# Copy this file and adapt. To trigger a release:
#   1. Bump version in pyproject.toml
#   2. Commit and tag:  git tag v0.1.0 && git push origin v0.1.0
#
# Requires:
#   - PYPI_API_TOKEN secret set in repo settings
#   - Trusted publishing configured on PyPI (preferred, then no token needed)
# =============================================================================

name: Release (Python)

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for trusted publishing

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install build twine

      - name: Verify version matches tag
        run: |
          PKG_VER=$(python3 -c "
            import tomllib
            with open('pyproject.toml','rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          TAG_VER="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "ERROR: pyproject.toml version ($PKG_VER) != tag version ($TAG_VER)"
            exit 1
          fi

      - name: Build
        run: python -m build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        # For a token-based fallback, add:
        # with:
        #   password: ${{ secrets.PYPI_API_TOKEN }}
