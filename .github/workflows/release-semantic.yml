# =============================================================================
# Semantic Release — auto-version + changelog + publish
# =============================================================================
#
# Copy into your repo. Automates the entire release process:
#   1. Scans commits since last tag (Conventional Commits)
#   2. Determines next version (major / minor / patch)
#   3. Generates changelog
#   4. Tags the release
#   5. Publishes to package registry
#
# Prerequisites:
#   - All commits must follow Conventional Commits format
#   - A GitHub token with contents:write permissions
# =============================================================================

name: Semantic Release

on:
  push:
    branches: [main, master]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # ── Node / npm ────────────────────────────────────────────────
      - name: Semantic Release (Node)
        if: hashFiles('package.json', 'package-lock.json', 'yarn.lock', 'pnpm-lock.yaml') != ''
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: latest
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
            @semantic-release/npm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── Python / PyPI ─────────────────────────────────────────────
      - name: Semantic Release (Python)
        if: hashFiles('pyproject.toml') != ''
        uses: python-semantic-release/python-semantic-release@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # ── Rust / crates.io ──────────────────────────────────────────
      - name: Semantic Release (Rust)
        if: hashFiles('Cargo.toml') != ''
        uses: katyo/semantic-release-cargo@v2
        with:
          cargo_token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # ── Go module ─────────────────────────────────────────────────
      - name: Semantic Release (Go)
        if: hashFiles('go.mod') != ''
        uses: go-semantic-release/action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
