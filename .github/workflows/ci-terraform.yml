# =============================================================================
# Terraform / OpenTofu CI — infrastructure quality gate
# =============================================================================
#
# Copy into your repo as .github/workflows/terraform.yml
# Requires: *.tf files in the repo
#
# What it does:
#   - terraform/tofu fmt -check
#   - terraform/tofu validate
#   - terraform/tofu plan (PR comment)
#   - Checkov / tfsec security scanning
#
# Secrets needed:
#   - Cloud provider credentials (AWS/GCP/Azure) for plan
# =============================================================================

name: Terraform CI

on:
  push:
    branches: [main, master]
    paths: ["**.tf", "**.tfvars"]
  pull_request:
    branches: [main, master]
    paths: ["**.tf", "**.tfvars"]

permissions:
  contents: read
  pull-requests: write

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: latest

      - name: tofu fmt check
        run: tofu fmt -check -recursive
        working-directory: ${{ vars.TF_WORK_DIR || '.' }}

  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: latest

      - name: tofu init
        run: tofu init -backend=false
        working-directory: ${{ vars.TF_WORK_DIR || '.' }}

      - name: tofu validate
        run: tofu validate
        working-directory: ${{ vars.TF_WORK_DIR || '.' }}

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ vars.TF_WORK_DIR || '.' }}
          framework: terraform
          quiet: true
          output_format: cli
          soft_fail: false

  plan:
    name: Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: latest

      - name: Configure cloud backend
        run: |
          # Set your backend config here or use env vars
          # tofu init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
          tofu init
        working-directory: ${{ vars.TF_WORK_DIR || '.' }}

      - name: tofu plan
        id: plan
        run: |
          tofu plan -no-color -out=tfplan 2>&1 | tee plan.txt
        working-directory: ${{ vars.TF_WORK_DIR || '.' }}

      - name: Post plan to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ vars.TF_WORK_DIR || '.' }}/plan.txt', 'utf8');
            const MAX_LEN = 60000;
            const body = plan.length > MAX_LEN
              ? plan.slice(0, MAX_LEN) + '\n\n... (truncated)'
              : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## OpenTofu Plan\n\`\`\`\n${body}\n\`\`\``
            });
