# =============================================================================
# Ansible CI — lint and test Ansible playbooks
# =============================================================================
#
# Copy into your repo as .github/workflows/ansible.yml
# Requires: *.yml playbooks, ansible.cfg or galaxy.yml
#
# What it does:
#   - ansible-lint playbooks/roles
#   - yamllint on all YAML files
#   - molecule test (if molecule.yml exists)
# =============================================================================

name: Ansible CI

on:
  push:
    branches: [main, master]
    paths: ["**/*.yml", "**/*.yaml", "**/ansible/**", "**/roles/**"]
  pull_request:
    branches: [main, master]
    paths: ["**/*.yml", "**/*.yaml", "**/ansible/**", "**/roles/**"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install ansible-lint yamllint

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint
        continue-on-error: true

  molecule:
    name: Molecule test
    runs-on: ubuntu-latest
    if: hashFiles('molecule.yml', 'molecule/**/molecule.yml') != ''
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          pip install ansible molecule molecule-plugins[docker] docker

      - name: Run molecule test
        run: molecule test
        continue-on-error: true
