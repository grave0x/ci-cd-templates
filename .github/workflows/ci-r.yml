# =============================================================================
# R CI — quality gate for R packages
# =============================================================================
#
# Copy into your repo as .github/workflows/ci.yml
# Requires: DESCRIPTION at repo root
#
# What it does:
#   - lintr
#   - R CMD check
#   - testthat
# =============================================================================

name: CI (R)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        r-version: ["4.3", "4.4"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up R ${{ matrix.r-version }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}

      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2

      - name: Lint
        run: Rscript -e 'lintr::lint_dir()'
        continue-on-error: true

      - name: Check
        run: R CMD check . --no-manual --as-cran
        continue-on-error: true
