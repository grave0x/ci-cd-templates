# =============================================================================
# GitHub Pages Deploy — build and deploy static site to GitHub Pages
# =============================================================================
#
# Copy into your repo. Builds a static site (Hugo, Jekyll, 11ty, Astro, etc.)
# and deploys to GitHub Pages. Auto-detects common SSGs.
#
# Repository settings required:
#   Settings > Pages > Source: GitHub Actions
# =============================================================================

name: GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Hugo
        if: hashFiles('hugo.toml', 'hugo.yaml', 'config/_default/hugo.toml') != ''
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Build with Hugo
        if: hashFiles('hugo.toml', 'hugo.yaml', 'config/_default/hugo.toml') != ''
        run: hugo --minify

      - name: Set up Node (for SSG)
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build with Node SSG
        if: hashFiles('package.json') != ''
        run: |
          npm ci
          npm run build 2>/dev/null || npx @11ty/eleventy 2>/dev/null || npx astro build 2>/dev/null || echo "No SSG detected"

      - name: Set up Jekyll
        if: hashFiles('_config.yml', 'Gemfile') != ''
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build with Jekyll
        if: hashFiles('_config.yml', 'Gemfile') != ''
        run: bundle exec jekyll build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: |
            ./public
            ./dist
            ./_site
            ./build
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
