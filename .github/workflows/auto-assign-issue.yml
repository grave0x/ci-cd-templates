# =============================================================================
# Auto-Assign Issues — assign issue author to their own issue
# =============================================================================
#
# Copy into your repo. Automatically assigns the issue author when they
# comment "take" or "assign me" on an unassigned issue.
# =============================================================================

name: Auto-Assign Issue

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  assign:
    runs-on: ubuntu-latest
    if: |
      github.event.issue.assignee == null &&
      contains(github.event.comment.body, 'take') ||
      contains(github.event.comment.body, 'assign me')
    steps:
      - name: Assign issue to commenter
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.addAssignees({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              assignees: [context.payload.comment.user.login]
            });

      - name: Add label
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['assigned']
            });
