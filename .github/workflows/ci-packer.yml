# =============================================================================
# Packer CI — validate and build machine images
# =============================================================================
#
# Copy into your repo as .github/workflows/packer.yml
# Requires: *.pkr.hcl files at repo root
#
# What it does:
#   - packer fmt --check
#   - packer validate
#   - packer build (on push to main or tag)
# =============================================================================

name: Packer CI

on:
  push:
    branches: [main, master]
    paths: ["**/*.pkr.hcl", "**/*.json"]
  pull_request:
    branches: [main, master]
    paths: ["**/*.pkr.hcl", "**/*.json"]

env:
  PACKER_VERSION: "1.11"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: ${{ env.PACKER_VERSION }}

      - name: Format check
        run: packer fmt --check .

      - name: Validate
        run: |
          for template in $(find . -name '*.pkr.hcl' -exec dirname {} \; | sort -u); do
            echo "Validating: $template"
            packer validate "$template"
          done

  build:
    name: Build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: ${{ env.PACKER_VERSION }}

      - name: Build images
        run: |
          for template in $(find . -name '*.pkr.hcl' -exec dirname {} \; | sort -u); do
            echo "Building: $template"
            packer build "$template"
          done
        env:
          # Add cloud credentials as needed:
          # AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          # AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          PKR_VAR_ami_regions: ${{ vars.PKR_VAR_AMI_REGIONS }}
