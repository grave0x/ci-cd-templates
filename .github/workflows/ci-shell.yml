# =============================================================================
# Shell Script CI — lint and static analysis for Bash/sh scripts
# =============================================================================
#
# Copy into your repo as .github/workflows/shell.yml
# Requires: *.sh files in the repo
#
# What it does:
#   - shellcheck (lint)
#   - shfmt (format check)
# =============================================================================

name: Shell CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck shfmt

      - name: Find scripts
        id: scripts
        run: |
          SCRIPTS=$(find . -name '*.sh' -not -path '*/vendor/*' -not -path '*/node_modules/*' -not -path '*/.git/*' | tr '\n' ' ')
          echo "scripts=$SCRIPTS" >> "$GITHUB_OUTPUT"

      - name: Shellcheck
        run: shellcheck ${{ steps.scripts.outputs.scripts }}

      - name: Format check (shfmt)
        run: shfmt -d ${{ steps.scripts.outputs.scripts }}
